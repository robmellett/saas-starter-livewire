<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tile { fill: #FAFAF7; stroke: #1F1F1C; stroke-width: 1.2; }
    .ink-thin { stroke: #1F1F1C; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .accent-red { fill: #C84A3B; }
    .accent-amber { fill: #D4A24C; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #1F1F1C; text-anchor: middle; letter-spacing: 0.3px; text-transform: uppercase; }
    .layer-label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; }
  </style>
  <rect class="tile" width="200" height="200" rx="6"/>
  <rect x="40" y="50" width="120" height="22" rx="3" class="accent-red"/>
  <rect x="40" y="78" width="120" height="22" rx="3" fill="#FAFAF7" stroke="#1F1F1C" stroke-width="1.2"/>
  <rect x="40" y="106" width="120" height="22" rx="3" fill="#FAFAF7" stroke="#1F1F1C" stroke-width="1.2"/>
  <rect x="40" y="134" width="120" height="22" rx="3" class="accent-amber"/>
  <text x="100" y="65" class="layer-label" fill="#FAFAF7">HTTP</text>
  <text x="100" y="93" class="layer-label" fill="#1F1F1C">Actions</text>
  <text x="100" y="121" class="layer-label" fill="#1F1F1C">Domain</text>
  <text x="100" y="149" class="layer-label" fill="#1F1F1C">Database</text>
  <line x1="30" y1="61" x2="40" y2="61" class="ink-thin"/>
  <line x1="30" y1="89" x2="40" y2="89" class="ink-thin"/>
  <line x1="30" y1="117" x2="40" y2="117" class="ink-thin"/>
  <line x1="30" y1="145" x2="40" y2="145" class="ink-thin"/>
  <line x1="30" y1="55" x2="30" y2="151" class="ink-thin"/>
  <text x="100" y="180" class="label">Laravel core</text>
</svg>
